# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: CI

on:
  merge_group: {}

  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  code-quality: write
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ⚙️ Setup
        uses: w5s/actions/setup@5ee596202a1135255f43fa75bb9483afc1ea8c77 # main
      - name: 🏗️ Build
        uses: w5s/actions/task@5ee596202a1135255f43fa75bb9483afc1ea8c77 # main
        with:
          task: build
      - name: 🔍 Validate
        uses: w5s/actions/task@5ee596202a1135255f43fa75bb9483afc1ea8c77 # main
        with:
          task: validate
